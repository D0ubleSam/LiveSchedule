<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>若木相羊 播出时间表</title>
<style>
  @font-face {
    font-family: "CustomFont";
    /* 把字体文件复制到这个html所在的同一个文件夹里，然后只写文件名即可，
       不要用 C:\Windows\Fonts\... 这种绝对路径，浏览器出于安全限制不允许跨目录读取本地文件 */
    src: url("HanYiChaoCuHeiJian-1.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
  }

  :root {
    --mainColor: #ffd166;
    --subtitleColor: rgba(255,255,255,0.65);
    --scheduleLabelColor: rgba(255,255,255,0.62);
    --dayColor: #9ecbff;
    --gameColor: rgba(126,232,199,0.55);
    --otherColor: rgba(201,167,255,0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 3840px;
    height: 2160px;
    overflow: hidden;
    background-color: #0a0a0a;
    font-family: "CustomFont", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    width: 640px;
    height: 360px;
    margin: 0;
    background-color: #0a0a0a;
    /* 十字底纹放在独立的伪元素里旋转，避免影响文字内容 */
    padding: 28px 44px 36px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    /* 直角，不用圆角，方便截图套用 */
    border-radius: 0;
    /* 界面放大显示，方便截图更清晰；不影响640x360的原始设计比例 */
    zoom: 6;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'><g transform='rotate(45 13 13)'><path d='M12 5h2v6h6v2h-6v6h-2v-6H6v-2h6z' fill='white' fill-opacity='0.06'/></g></svg>");
    background-size: 26px 26px;
    background-repeat: repeat;
    background-position: 0 0;
    animation: driftTexture 3.5s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  .card > * {
    position: relative;
    z-index: 1;
  }
  @keyframes driftTexture {
    from { background-position: 0 0; }
    to   { background-position: 26px 26px; }
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .header-row, .time-row, .schedule-block, .tag-row, .footer-row {
    animation: popIn 0.5s ease-out both;
  }
  .header-row   { animation-delay: 0.1s; }
  .time-row     { animation-delay: 0.35s; }
  .schedule-block { animation-delay: 0.6s; }
  .tag-row      { animation-delay: 0.85s; }
  .footer-row   { animation-delay: 1.1s; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .title-group {
    display: flex;
    align-items: baseline;
    gap: 13px;
  }
  .name {
    color: var(--mainColor);
    font-size: 42px;
    font-weight: 400;
  }
  .subtitle {
    color: var(--subtitleColor);
    font-size: 16px;
  }
  .time-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
    margin-left: 12px;
  }
  .time {
    color: #ffffff;
    font-size: 62px;
    font-weight: 400;
    letter-spacing: -1.5px;
    line-height: 1;
  }
  .time-note {
    color: rgba(255,255,255,0.45);
    font-size: 14px;
  }

  .schedule-block {
    margin-bottom: 10px;
  }
  .schedule-label {
    color: var(--scheduleLabelColor);
    font-size: 13px;
    letter-spacing: 0.5px;
    margin: 0 0 6px;
  }
  .week-row {
    display: flex;
    gap: 8px;
  }
  .day-cell {
    flex: 1 1 0;
    flex-shrink: 0;
    text-align: center;
    padding: 6px 0;
    border-radius: 6px;
    background: rgba(158,203,255,0.12);
    color: var(--dayColor);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .day-cell.rest {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.28);
    flex-direction: column;
    gap: 2px;
  }
  .day-cell.rest .day-num {
    font-size: 12px;
  }
  .day-cell.rest .rest-label {
    font-size: 15px;
    font-weight: 400;
  }

  .tag-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 4px 0 14px 18px;
  }
  .tag {
    font-size: 12px;
    padding: 5px 13px;
    border-radius: 20px;
    background: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.6);
  }
  .tag.primary {
    background: rgba(255,209,102,0.16);
    color: var(--mainColor);
    font-weight: 400;
  }
  .tag.game {
    background: rgba(126,232,199,0.08);
    color: var(--gameColor);
  }
  .tag.other {
    background: rgba(201,167,255,0.08);
    color: var(--otherColor);
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 0.5px solid rgba(255,255,255,0.15);
    padding-top: 8px;
    margin-top: auto;
  }
  .footer-text p {
    margin: 0;
  }
  .footer-main {
    color: #fff;
    font-size: 13px;
  }
  .room-number {
    color: var(--mainColor);
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .footer-note {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    margin-top: 4px !important;
  }
  .qr-placeholder {
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,0.08);
    border: 0.5px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    object-fit: contain;
    display: block;
  }

</style>
</head>

<script>
(function(){
const p=new URLSearchParams(location.search);
const set=(sel,key)=>{const e=document.querySelector(sel); if(e&&p.has(key)) e.textContent=p.get(key)};
set('.name','name');
set('.room-number','room');
set('#platformName','platform');
set('.time','time');
set('.time-note','timeNote');
set('.footer-note','footerNote');
const rests=p.get('rest');
if(rests){
  const days=document.querySelectorAll('.day-cell');
  days.forEach(e=>{ e.classList.remove('rest'); e.textContent=e.dataset.day; });
  rests.split(',').forEach(n=>{
    const idx=Number(n)-1;
    const e=days[idx];
    if(e){
      e.classList.add('rest');
      e.innerHTML='<span class="day-num">'+e.dataset.day+'</span><span class="rest-label">周休</span>';
    }
  });
}
if(p.has('bg'))document.querySelector('.card').style.backgroundColor=p.get('bg');
const cssVars={main:'--mainColor',subtitleColor:'--subtitleColor',scheduleLabelColor:'--scheduleLabelColor',dayColor:'--dayColor',gameColor:'--gameColor',otherColor:'--otherColor'};
Object.keys(cssVars).forEach(key=>{ if(p.has(key)) document.documentElement.style.setProperty(cssVars[key], p.get(key)); });

if(p.has('tags')){
  const tagRow=document.getElementById('tagRow');
  const primary=tagRow.querySelector('.tag.primary');
  tagRow.innerHTML='';
  if(primary) tagRow.appendChild(primary);
  p.get('tags').split(',').map(s=>s.trim()).filter(Boolean).forEach(name=>{
    const span=document.createElement('span');
    span.className='tag ' + (name.startsWith('游戏回') ? 'game' : 'other');
    span.textContent=name;
    tagRow.appendChild(span);
  });
}
})();
</script>
</body>
</html>
